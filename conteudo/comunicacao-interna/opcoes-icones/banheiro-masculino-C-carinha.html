<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lato:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,600;1,500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>@page { size: 210mm 297mm; margin: 0; }
html { font-size: 10mm; } html, body { width: 210mm; height: 297mm; }

  :root { --verm: #A00F0F; --capa: #8C1C1C; --tinta: #1E1E1E; --cinza: #6E6E6E;
          --fio: #E4E4DF; --card: #F6F2F2; --papel: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { position: relative; overflow: hidden; background: var(--papel); color: var(--tinta);
         font-family: 'Lato', sans-serif; display: flex; flex-direction: column; }
  .fit { display: inline-block; white-space: nowrap; }
  .kicker { font-family: 'Poppins', sans-serif; font-weight: 600; text-transform: uppercase; color: var(--verm); }
  .titulo { font-family: 'Lora', serif; font-weight: 600; line-height: 1.05; letter-spacing: -0.01em; }
  .regua { background: var(--verm); }
  .diag { position: absolute; top: 0; right: 0; pointer-events: none; }
  .diag line { stroke: var(--verm); stroke-opacity: .28; }
  .rodape { flex: none; display: flex; justify-content: space-between; align-items: baseline; border-top: .04rem solid var(--fio); }
  .marca { font-family: 'Poppins', sans-serif; font-weight: 700; letter-spacing: .06em; }
  .rodape .apoio { color: var(--cinza); }
  main { display: flex; flex-direction: column; }

  body { padding: 2.2rem 1.9rem 1.3rem; }
  .kicker { font-size: .5rem; letter-spacing: .22em; }
  .titulo { font-size: 2.9rem; margin-top: .5rem; }
  .regua { width: 2.4rem; height: .1rem; margin: 1.1rem 0 0; }
  main { flex: 1; justify-content: center; }
  ol { list-style: none; border-bottom: .04rem solid var(--fio); }
  li { display: flex; gap: .8rem; align-items: baseline; padding: .62rem 0; border-top: .04rem solid var(--fio);
       font-size: .9rem; line-height: 1.3; }
  li b { flex: none; width: 1.3rem; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: .58rem; color: var(--verm); letter-spacing: .04em; }
  .lembrete { margin-top: 1.3rem; background: var(--card); border-left: .12rem solid var(--verm);
              padding: .75rem .9rem; font-size: .72rem; line-height: 1.4; }
  .lembrete strong { font-weight: 700; }
  .rodape { padding-top: .5rem; } .marca { font-size: .46rem; } .apoio { font-size: .42rem; }
  
  body { padding-top: 1.8rem; }
  .titulo { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .01em; font-size: 2.9rem; line-height: 1.1; margin-top: .3rem; }
  .regua { margin-top: .7rem; }
  .lembrete { margin-top: 1rem; }
  .lembrete strong { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .03em; color: var(--verm); }
  li.ic { align-items: center; gap: .9rem; padding: .38rem 0; }
  li .ico { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; background: var(--card); padding: .3rem; }
  li .ico svg { width: 100%; height: 100%; display: block; }
  li .ico .v { stroke: var(--verm); } li .ico .f { fill: var(--verm); stroke: none; }
  li .ico { padding: .16rem; background: #FBF4F4; } li .ico .r { fill: #F7DADB; } li .ico .p { fill: #1E1E1E; stroke: none; }
    li .ico .b { fill: var(--verm); stroke: #fff; stroke-width: 2; } li .ico .bw { stroke: #fff; stroke-width: 3.4; }</style></head>
<body><svg class="diag" style="width:7rem;height:7rem" viewBox="0 0 100 100">
  <line x1="34" y1="0" x2="100" y2="66" stroke-width="0.5"/><line x1="48" y1="0" x2="100" y2="52" stroke-width="0.5"/><line x1="62" y1="0" x2="100" y2="38" stroke-width="0.5"/><line x1="76" y1="0" x2="100" y2="24" stroke-width="0.5"/><line x1="90" y1="0" x2="100" y2="10" stroke-width="0.5"/></svg>
  <header><div class="kicker">Banheiro masculino</div><h1 class="titulo">Atenção</h1><div class="regua"></div></header>
  <main>
    <ol><li class="ic"><span class="ico"><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="8" width="16" height="20" rx="3" class="r"/><path d="M6 30h44c0 11-8 17-18 18l2 9H16l2-10C11 45 6 39 6 30z" class="r"/><circle cx="21" cy="36" r="2.2" class="p"/><circle cx="31" cy="36" r="2.2" class="p"/><path d="M22 43q4 -3.6 8 0"/><circle cx="51" cy="13" r="10" class="b"/><path d="M44 6l14 14" class="bw"/></svg></span><span>Não suba no vaso sanitário</span></li><li class="ic"><span class="ico"><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 4l6 18 18 6-18 6-6 18-6-18-18-6 18-6z" class="r"/><circle cx="26" cy="26" r="2.2" class="p"/><circle cx="34" cy="26" r="2.2" class="p"/><path d="M26.5 31q3.5 3.15 7 0"/><path d="M52 42l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" class="f"/><path d="M10 48l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" class="f"/></svg></span><span>Mantenha este ambiente limpo</span></li><li class="ic"><span class="ico"><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="14" width="12" height="18" rx="3" class="r"/><rect x="20" y="3" width="8" height="29" rx="3" class="r"/><path d="M3 33h42c0 10-7 16-17 17l2 9H14l2-10C9 47 3 41 3 33z" class="r"/><circle cx="19" cy="39" r="2.2" class="p"/><circle cx="29" cy="39" r="2.2" class="p"/><path d="M20 43q4 3.6 8 0"/><path d="M55 34V8M48 15l7-7 7 7" class="v"/></svg></span><span>Levante a tampa antes de usar</span></li><li class="ic"><span class="ico"><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="12" width="20" height="30" rx="5" class="r"/><ellipse cx="16" cy="13" rx="10" ry="4" fill="#fff"/><circle cx="16" cy="13" r="2"/><circle cx="12" cy="26" r="2.2" class="p"/><circle cx="20" cy="26" r="2.2" class="p"/><path d="M12.5 31q3.5 3.15 7 0"/><path d="M26 8c11-7 22-3 26 14" class="v"/><path d="M46 18l6 5 4-6" class="v"/><path d="M36 34h22l-3 24H39z" class="r"/><path d="M33 34h28M43 34v-3h8v3"/></svg></span><span>Jogue o papel higiênico no lixo</span></li><li class="ic"><span class="ico"><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 5S13 24 13 36a17 17 0 0 0 34 0C47 24 30 5 30 5z" class="r"/><circle cx="25" cy="36" r="2.2" class="p"/><circle cx="35" cy="36" r="2.2" class="p"/><path d="M26 42q4 3.6 8 0"/><path d="M50 13a5 5 0 0 1 0 8M55 9a10 10 0 0 1 0 16" class="v"/></svg></span><span>Após o uso, dê a descarga</span></li></ol>
    <div class="lembrete"><strong>Lembre-se:</strong> depois de você, outras pessoas vão usar este banheiro.</div>
  </main>
  <div class="rodape"><span class="marca">TATSUO ACADEMY</span><span class="apoio">Comunicação interna</span></div><script>
document.fonts.ready.then(() => {
  document.querySelectorAll('.fit').forEach(el => {
    const m = el.closest('main'), cs = getComputedStyle(m);
    const max = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.getBoundingClientRect().width > max && fs > 4) { fs *= 0.98; el.style.fontSize = fs + 'px'; }
  });
  document.body.dataset.ok = '1';
});</script></body></html>
