<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Great+Vibes&family=Noto+Serif+JP:wght@600&family=Lato:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,600;1,500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>@page { size: 200mm 300mm; margin: 0; }
html { font-size: 10mm; } html, body { width: 200mm; height: 300mm; }

  :root { --verm: #A00F0F; --capa: #8C1C1C; --tinta: #1E1E1E; --cinza: #6E6E6E;
          --fio: #E4E4DF; --card: #F6F2F2; --papel: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { position: relative; overflow: hidden; background: var(--papel); color: var(--tinta);
         font-family: 'Lato', sans-serif; display: flex; flex-direction: column; }
  .fit { display: inline-block; white-space: nowrap; }
  .kicker { font-family: 'Poppins', sans-serif; font-weight: 600; text-transform: uppercase; color: var(--verm); }
  .titulo { font-family: 'Lora', serif; font-weight: 600; line-height: 1.05; letter-spacing: -0.01em; }
  .regua { background: var(--verm); }
  .diag { position: absolute; top: 0; right: 0; pointer-events: none; }
  .diag line { stroke: var(--verm); stroke-opacity: .28; }
  .rodape { flex: none; display: flex; justify-content: space-between; align-items: baseline; border-top: .04rem solid var(--fio); }
  .marca { font-family: 'Poppins', sans-serif; font-weight: 700; letter-spacing: .06em; }
  .rodape .apoio { color: var(--cinza); }
  main { display: flex; flex-direction: column; }

  body { background: #0E0E0E; color: #fff; }
  .fita { flex: none; height: 1.3rem; background: repeating-linear-gradient(-45deg, #A91C20 0 .9rem, #0E0E0E .9rem 1.8rem); }
  main { flex: 1; padding: .9rem 1.4rem .4rem; justify-content: center; align-items: center; text-align: center; gap: .15rem; }
  main > div { width: 100%; }
  .l { font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: 1.08; letter-spacing: .01em; }
  .l.caixa { background: #A91C20; padding: .05rem .5rem .12rem; }
  .l.branca { background: #fff; color: #0E0E0E; padding: .28rem .5rem .12rem; margin-top: .25rem; display: inline-block; }
  .pequena { display: flex; align-items: center; gap: .6rem; justify-content: center; }
  .pequena::before, .pequena::after { content: ""; flex: 1; height: .08rem; background: #fff; }
  .icones { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-top: .9rem; padding-top: .8rem; border-top: .06rem solid rgba(255,255,255,.35); }
  .icones div { display: flex; flex-direction: column; align-items: center; }
  .icones svg { width: 2.2rem; height: 2.2rem; border: .08rem solid #fff; border-radius: 50%; padding: .4rem; stroke: #fff; }
  .icones .v { stroke: #E0393E; } .icones .f { fill: #E0393E; stroke: none; }
  .icones span { margin-top: .35rem; font-family: 'Anton', sans-serif; font-size: .5rem; letter-spacing: .06em; line-height: 1.1; }
  .marca { flex: none; text-align: center; font-size: .32rem; letter-spacing: .35em; color: rgba(255,255,255,.6); padding: .35rem 0 .4rem; }</style></head>
<body><div class="fita"></div>
  <main>
    <div class="pequena"><span class="fit l" style="font-size:1.5rem">Use o</span></div><div><span class="fit l caixa" style="font-size:3.8rem">Banheiro</span></div><div><span class="fit l " style="font-size:2.2rem">como se tivesse</span></div><div><span class="fit l caixa" style="font-size:3.8rem">cometido</span></div><div><span class="fit l " style="font-size:3.8rem">um crime.</span></div><div><span class="fit l branca" style="font-size:1.7rem">Não deixe vestígios.</span></div>
    <div class="icones"><div><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="32" width="36" height="20" rx="9"/><path d="M13 39h12"/><circle cx="44" cy="18" r="7" class="v"/><circle cx="28" cy="14" r="4" class="v"/><circle cx="55" cy="34" r="4" class="v"/></svg><span>HIGIENE</span></div><div><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 7s-16 19-16 30a16 16 0 0 0 32 0C48 26 32 7 32 7z"/><path d="M25 39a7 7 0 0 0 11 5" class="v"/><path d="M52 12a5 5 0 0 1 0 7M56 8a10 10 0 0 1 0 15" class="v"/></svg><span>DESCARGA</span></div><div><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="22" r="9"/><circle cx="16" cy="22" r="3"/><path d="M25 22v16H13"/><path d="M20 10c10-8 24-6 29 12" class="v"/><path d="M43 18l6 5 3-7" class="v"/><path d="M36 32h20l-3 24H39z"/><path d="M34 32h24M42 32v-3h8v3M43 38v13M49 38v13"/></svg><span>PAPEL NO LIXO</span></div><div><svg viewBox="0 0 64 64" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M27 5l5.5 16.5L49 27l-16.5 5.5L27 49l-5.5-16.5L5 27l16.5-5.5z"/><path d="M49 39l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" class="v f"/><path d="M52 6l1.8 4.2L58 12l-4.2 1.8L52 18l-1.8-4.2L46 12l4.2-1.8z" class="v f"/><path d="M8 50l1.5 3.5L13 55l-3.5 1.5L8 60l-1.5-3.5L3 55l3.5-1.5z" class="v f"/></svg><span>MANTENHA LIMPO</span></div></div>
  </main>
  <span class="marca">TATSUO ACADEMY</span>
  <div class="fita"></div><script>
document.fonts.ready.then(() => {
  document.querySelectorAll('.fit').forEach(el => {
    const m = el.closest('main'), cs = getComputedStyle(m);
    const max = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.getBoundingClientRect().width > max && fs > 4) { fs *= 0.98; el.style.fontSize = fs + 'px'; }
  });
  document.body.dataset.ok = '1';
});</script></body></html>
