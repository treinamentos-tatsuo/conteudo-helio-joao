<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .slide-photo{ position:absolute; bottom:0; left:0; width:100%; display:block;
    object-fit:cover; object-position:center bottom; mix-blend-mode:multiply; z-index:1;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);
    mask-image:linear-gradient(to bottom,transparent 0%,#000 30%); }
  .top{ position:absolute; left:0; right:0; padding:0 70px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:36px; }
  .line{ font-size:42px; line-height:1.30; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  .sus{ font-size:31px; font-style:italic; color:#5A5450; margin-top:12px; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.12; letter-spacing:0.5px; color:#A91C20; }
</style>
</head>
<body>
<style>.line:not(.anton):not(.sus){font-size:42px}</style>
  <div class="slide">
    <img class="slide-photo" src="../imagens/img-17.png" alt="" onerror="this.style.display='none'" style="height:820px;">
    <div class="top" style="top:235px">
      <div class="stanza">
        <div class="line">O mês não começa no dia 1.</div>
        <div class="line">Pra você, ele começa no dia da virada.</div>
      </div>
      <div class="stanza">
        <div class="line">Comenta <span class="red">VIRADA</span> que eu te mostro</div>
        <div class="line">como achar a sua e puxar ela pra trás.</div>
      </div>
    </div>
  </div>
</body>
</html>
