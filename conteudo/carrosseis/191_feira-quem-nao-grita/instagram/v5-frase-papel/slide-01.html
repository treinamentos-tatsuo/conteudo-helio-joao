<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;font-family:'Source Serif Pro',serif}

<div class="slide">
  <img src="../imagens/img-01-pb.png" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:1010px;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);z-index:1">
  <div class="top" style="top:230px">
    <div class="line">Na feira, quem não grita</div>

  </div>
</div>
