<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif;color:#fff;position:relative}
img{position:absolute}
.g{position:absolute;inset:0}
.blk{position:absolute;display:flex;flex-direction:column;align-items:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.ln{white-space:nowrap;line-height:1;display:inline-block}
.sm{font-weight:600;letter-spacing:.5px}
.bg{font-weight:700;letter-spacing:-.5px}
.r{align-self:flex-end}
</style></head><body>
  <img src="../imagens/img-preto.jpg" style="height:1250px;left:200px;top:0">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 75%,#000 90%)"></div>
  <div class="blk" style="left:90px;top:1030px">
    <div class="ln sm" data-w="560">Na feira, quem não grita</div>
    <div class="ln sm" data-w="560" style="margin-top:14px">volta pra casa com a</div>
    <div class="ln bg" data-w="900" style="margin-top:10px">banca cheia.</div>
  </div>
<script>
document.fonts.ready.then(()=>{document.querySelectorAll('[data-w]').forEach(e=>{
 const W=+e.dataset.w;let fs=40;e.style.fontSize=fs+'px';
 for(let i=0;i<30;i++){fs=fs*W/e.getBoundingClientRect().width;e.style.fontSize=fs+'px';}
});});
</script>
</body></html>
