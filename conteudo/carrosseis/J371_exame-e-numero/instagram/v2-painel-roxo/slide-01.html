<!doctype html><html><head><meta charset="utf-8">
<!-- J371_exame-e-numero: modelo da J321/J345. Fotos 62º Congresso SBCP: congresso-sbcp-2026-11-11_7489 (P&B, cima) + _7491 (cor, baixo), mesmo momento. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1350px;background:#000;overflow:hidden;position:relative;color:#fff;font-family:Montserrat,sans-serif}
.p{position:absolute;left:0;width:1080px;height:675px;overflow:hidden}.p img{width:1080px;height:675px;display:block}
.g{position:absolute;inset:0}
.blk{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.ln{white-space:nowrap;line-height:1;display:inline-block}
.sm{font-weight:600;letter-spacing:.5px;font-size:34px}.bg{font-weight:700;letter-spacing:-.5px}</style></head><body>
<div class="p" style="top:0"><img src="../imagens/cima.jpg">
 <div class="g" style="background:radial-gradient(ellipse 34% 60% at 52% 42%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.82) 100%)"></div>
 <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 38%,rgba(0,0,0,.8) 66%,rgba(0,0,0,.93) 100%)"></div>
 <div class="blk" style="bottom:55px">
  <div class="ln sm">Nenhum cirurgião opera</div>
  <div class="ln bg" data-w="680" style="margin-top:8px">sem olhar o exame.</div>
 </div></div>
<div class="p" style="top:675px"><img src="../imagens/baixo.jpg">
 <div class="g" style="background:radial-gradient(ellipse 34% 60% at 52% 42%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.82) 100%)"></div>
 <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 10%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 70%,rgba(0,0,0,.93) 100%)"></div>
 <div class="blk" style="bottom:120px">
  <div class="ln sm">Mas tem muita clínica sendo tocada</div>
  <div class="ln bg" data-w="680" style="margin-top:8px">sem olhar o número.</div>
 </div></div>
<script>
document.fonts.ready.then(()=>{document.querySelectorAll('[data-w]').forEach(e=>{
 const W=+e.dataset.w;let fs=40;e.style.fontSize=fs+'px';
 for(let i=0;i<30;i++){fs=fs*W/e.getBoundingClientRect().width;e.style.fontSize=fs+'px';}
});});
</script></body></html>
