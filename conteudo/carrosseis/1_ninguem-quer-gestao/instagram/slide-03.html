<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{
    width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif;
  }
  /* figura em canvas cheio 1:1 (composicao original do banco preservada) */
  .figura-full{
    position:absolute; top:0; left:0; width:1080px; height:1350px;
    mix-blend-mode:multiply;
  }
  .text-top{
    position:absolute; top:350px; left:0; right:0; padding:0 60px;
    text-align:center; z-index:2;
  }
  .line{ font-size:58px; line-height:1.24; font-weight:700; color:#1A1A1A; }
  .line .red{ color:#A91C20; }
</style>
</head>
<body>
  <div class="slide">
    <img class="figura-full" src="../imagens/img-03.png" alt="">
    <div class="text-top">
      <div class="line">abre pra ganhar <span class="red">dinheiro</span>.</div>
    </div>
  </div>
</body>
</html>
