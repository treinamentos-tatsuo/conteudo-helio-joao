<!DOCTYPE html><html><head><meta charset="utf-8"><style>

.lbl{position:absolute;top:3px;left:3px;background:#000;color:#fff;font-size:20px;font-weight:bold;padding:2px 7px;}
</style></head><body><div class="grid">
<div class="cell"><img src="slide-04.png"><div class="lbl">04</div></div>
<div class="cell"><img src="slide-05.png"><div class="lbl">05</div></div>
<div class="cell"><img src="slide-06.png"><div class="lbl">06</div></div>
<div class="cell"><img src="slide-07.png"><div class="lbl">07</div></div>
</div></body></html>
