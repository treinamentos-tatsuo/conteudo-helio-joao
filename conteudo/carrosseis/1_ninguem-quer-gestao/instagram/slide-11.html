<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{
    width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif;
  }
  .figura{
    position:absolute; top:560px; left:50%; transform:translateX(-50%);
    height:640px; width:auto; mix-blend-mode:multiply;
  }
  .text-top{ position:absolute; top:300px; left:0; right:0; padding:0 60px; text-align:center; z-index:2; }
  .text-bottom{ position:absolute; bottom:120px; left:0; right:0; padding:0 60px; text-align:center; z-index:2; }
  .line{ font-size:58px; line-height:1.24; font-weight:400; color:#1A1A1A; }
  .line.md{ font-size:50px; }
  .line.sm{ font-size:52px; }
  .line.red{ font-weight:700; color:#A91C20; }
  .line b{ font-weight:700; }
  .line .red{ color:#A91C20; }
  .line.anton{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:62px; line-height:1.14; letter-spacing:0.5px; color:#A91C20;
  }
  .line.anton.preto{ color:#1A1A1A; }
  .scribble-wrap{ position:relative; display:inline-block; }
  .scribble-wrap .under-img{ position:absolute; left:-3%; width:106%; height:0.52em; bottom:-0.26em; pointer-events:none; }
  .circle-wrap{ position:relative; display:inline-block; }
  .circle-wrap .circle-img{ position:absolute; left:-9%; top:-42%; width:118%; height:184%; pointer-events:none; }
  .cta-big{ font-size:74px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .cta-big .red{ color:#A91C20; }
  .cta-sm{ font-size:38px; font-weight:400; line-height:1.3; color:#1A1A1A; margin-top:14px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="text-top">
      <div class="line">Criança faz o que quer.</div>
    </div>
  <img class="figura" src="../imagens/img-11.png" alt="" style="bottom:60px;top:auto;height:720px">
  </div>
</body>
</html>
