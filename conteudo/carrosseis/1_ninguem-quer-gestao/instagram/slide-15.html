<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .figura{ position:absolute; left:50%; transform:translateX(-50%); mix-blend-mode:multiply; }
  .figura-full{ position:absolute; top:0; left:0; width:1080px; height:1350px; mix-blend-mode:multiply; }
  .top{ position:absolute; left:0; right:0; padding:0 70px; text-align:center; z-index:2; }
  .bottom{ position:absolute; left:0; right:0; padding:0 70px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:46px; }
  .line{ font-size:44px; line-height:1.26; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; }
  .bred{ color:#A91C20; font-weight:700; }
  b{ font-weight:700; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.12; letter-spacing:0.5px; color:#A91C20; font-size:60px; }
  .anton.preto{ color:#1A1A1A; }
  .scr{ position:relative; display:inline-block; }
  .scr .u{ position:absolute; left:-3%; width:106%; height:0.5em; bottom:-0.26em; pointer-events:none; }
  .cir{ position:relative; display:inline-block; }
  .cir .c{ position:absolute; left:-11%; top:-46%; width:122%; height:192%; pointer-events:none; }
  .cta-big{ font-size:74px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .cta-sm{ font-size:36px; font-weight:400; line-height:1.3; color:#1A1A1A; margin-top:16px; }
</style>
</head>
<body>
  <div class="slide">
  <div class="top" style="top:230px">
    <div class="stanza">
      <div class="line" style="font-size:44px">Dinheiro sem gestão é só sorte.</div>
      <div class="line" style="font-size:44px"><span class="scr">E sorte não constrói empresa.<img class="u" src="../../_banco-referencias/elementos/sublinhado-rabisco.png" alt=""></span></div>
    </div>
  </div>
  <img class="figura" src="../imagens/img-15.png" alt="" style="top:430px;height:470px">
  <div class="bottom" style="bottom:180px">
    <div class="cta-big">Comenta <span class="red">MBV</span>,</div>
    <div class="cta-sm">que eu te mostro por onde a gestão começa.</div>
  </div>
  </div>
</body>
</html>
