<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{
    width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif;
  }
  /* figura solta, isolada no miolo */
  .figura{
    position:absolute; top:470px; left:50%; transform:translateX(-50%);
    height:580px; width:auto; mix-blend-mode:multiply;
  }
  .text-top{
    position:absolute; top:250px; left:0; right:0; padding:0 60px;
    text-align:center; z-index:2;
  }
  .text-bottom{
    position:absolute; bottom:120px; left:0; right:0; padding:0 60px;
    text-align:center; z-index:2;
  }
  .line{ font-size:58px; line-height:1.24; font-weight:400; color:#1A1A1A; }
  .line.sm{ font-size:52px; }
  .line b{ font-weight:700; }
  .line.anton{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:73.7px; line-height:1.14; letter-spacing:0.5px; color:#A91C20;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="text-top">
      <div class="line">Sejamos honestos, empresário.</div>
      <div class="line anton">Gestão é chata pra cacete.</div>
    </div>
    <img class="figura" src="../imagens/img-02.png" alt="">
    <div class="text-bottom">
      <div class="line sm">Ninguém abre empresa animado pra</div>
      <div class="line sm"><b>ler planilha...</b></div>
    </div>
  </div>
</body>
</html>
