<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; background:#FBF9F4 url("../../_banco-referencias/elementos/moldura-fabula.png") center/cover no-repeat; font-family:'Source Serif Pro',serif; color:#1F1B16; }
  .text{ margin-top:175px; padding:0 78px; text-align:center; font-weight:400; font-size:40px; line-height:1.42; z-index:2; }
  .stanza + .stanza{ margin-top:1.15em; }
  .text b{ font-weight:700; }
  .ilustra-box{ margin-top:28px; margin-bottom:60px; width:915px; flex:1 1 auto; min-height:0; z-index:1; }
  .ilustra-box img{ width:100%; height:100%; object-fit:cover; display:block; mix-blend-mode:multiply;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 6%, #000 94%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .ilustra-box.duo{ display:flex; gap:16px; }
  .ilustra-box.duo img{ width:calc(50% - 8px); }
  .ilustra-box.duo img:nth-child(1){ object-position:50% center; }
  .ilustra-box.duo img:nth-child(2){ object-position:50% center; }
  .ilustra-box.wide{ max-height:830px; margin-top:auto; }
  .ilustra-box.sq img{ object-fit:contain; }
  .oq{ margin-left:-0.415em; } .cq{ margin-right:-0.430em; }
  .moral-title{ font-weight:700; font-size:44px; }
</style></head><body><div class="slide">
  <div class="text">
    <div class="stanza">O velho respondeu, sem pressa:</div>
    <div class="stanza"><b><span class="oq">&ldquo;</span>Eu afiava o machado.<span class="cq">&rdquo;</span></b></div>
  </div>
  <div class="ilustra-box"><img src="../imagens/img-10.png" alt=""></div>
</div></body></html>
