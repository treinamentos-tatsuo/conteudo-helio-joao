<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 78px; text-align:center; z-index:2; }
  .bottom{ position:absolute; left:0; right:0; padding:0 78px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:52px; }
  .line{ font-size:44px; line-height:1.30; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  b{ font-weight:700; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.14; letter-spacing:0.5px; color:#A91C20; }
  .scr{ position:relative; display:inline-block; }
  .scr .u{ position:absolute; left:-3%; width:106%; height:0.5em; bottom:-0.30em; pointer-events:none; }
  .impact{ font-size:54px; font-weight:700; line-height:1.22; color:#1A1A1A; }
  .setup{ font-size:38px; font-weight:400; line-height:1.3; color:#1A1A1A; }
  .cta-big{ font-size:74px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .cta-sm{ font-size:34px; font-weight:400; line-height:1.34; color:#1A1A1A; margin-top:16px; }
</style>
</head>
<body>
  <div class="slide">
    <img src="../imagens/img-13.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:298px;left:0;width:100%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 33%,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 33%,#000 86%,transparent 100%);z-index:1;">
    <div class="top" style="top:212px">
      <div class="stanza">
        <div class="line">Carregar o risco é ser dono.</div>
        <div class="line"><span class="scr">Fazer a casa dar dinheiro é o método.<img class="u" src="../../_banco-referencias/elementos/sublinhado-rabisco.png" alt=""></span></div>
      </div>
    </div>
    <div class="bottom" style="bottom:148px">
      <div class="cta-big">Comenta <span class="red">307</span>,</div>
      <div class="cta-sm">que eu te mostro, no MBV, onde a sua empresa<br>ganha e onde ela perde dinheiro.</div>
    </div>
  </div>
</body>
</html>
