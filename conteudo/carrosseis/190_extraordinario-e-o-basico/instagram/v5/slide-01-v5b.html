<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif;color:#fff}
.p{position:absolute;left:0;width:1080px;overflow:hidden}
.p img{position:absolute}
.g{position:absolute;inset:0}
.blk{position:absolute;left:90px;width:530px;display:flex;flex-direction:column;align-items:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.ln{white-space:nowrap;line-height:1;display:inline-block}
.sm{font-weight:600;letter-spacing:.5px}
.bg{font-weight:700;letter-spacing:-.5px}
.r{align-self:flex-end}
</style></head><body>
<div class="p" style="top:0;height:610px">
  <img src="../../imagens/foto-p1-pb.jpg" style="width:1700px;left:-270px;top:-150px">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.9) 100%)"></div>
  <div class="blk" style="top:400px">
    <div class="ln sm" data-w="330">Não há nada mais</div>
    <div class="ln bg" data-w="530" style="margin-top:10px">extraordinário</div>
  </div>
</div>
<div class="p" style="top:610px;height:740px">
  <img src="../../imagens/foto-p4-pb.jpg" style="width:1500px;left:0;top:-770px">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 14%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.6) 85%,rgba(0,0,0,.92) 100%)"></div>
  <div class="blk" style="top:445px">
    <div class="ln sm" data-w="530">que fazer o básico bem feito</div>
    <div class="ln bg" data-w="530" style="margin-top:12px;margin-left:45px">todos os dias.</div>
  </div>
</div>
<script>
document.fonts.ready.then(()=>{document.querySelectorAll('[data-w]').forEach(e=>{
 const W=+e.dataset.w;let fs=40;e.style.fontSize=fs+'px';
 for(let i=0;i<30;i++){fs=fs*W/e.getBoundingClientRect().width;e.style.fontSize=fs+'px';}
});});
</script>
</body></html>
