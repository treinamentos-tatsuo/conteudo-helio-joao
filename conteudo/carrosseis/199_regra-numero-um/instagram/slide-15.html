<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 90px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:34px; }
  .line{ font-size:44px; line-height:1.32; font-weight:600; color:#1A1A1A; }
  .line b{ font-weight:700; }
  .red{ color:#A91C20; font-weight:700; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; line-height:1.12; letter-spacing:0.5px; color:#A91C20; }
  .cta-big{ font-size:64px; font-weight:700; line-height:1.2; color:#1A1A1A; }
</style>
</head>
<body>
<style>.line:not(.anton){font-size:44px}</style>
  <div class="slide">
    <img src="../imagens/img-15.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:0;width:100%;height:1059px;object-fit:cover;object-position:center bottom;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);z-index:1;">
    <div class="top" style="top:240px">
      <div class="stanza">
        <div class="line">Empresa próspera faz gente próspera.</div>
        <div class="line red">E começa pela regra número um.</div>
      </div>
      <div class="cta-big" style="margin-top:34px">Comenta <span class="red">PROSPERO</span></div>
      <div class="stanza" style="margin-top:18px">
        <div class="line">que eu mando o link no seu direct.</div>
      </div>
    </div>
  </div>
</body>
</html>
