</style></head><body><div class="slide"><div class="bar">13:45</div><div class="nav"><div class="back"><svg width="24" height="42" viewBox="0 0 24 42" fill="none" stroke="#A91C20" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 4 21l16 17"/></svg>Notas</div><div class="icons"><svg width="44" height="54" viewBox="0 0 44 54" fill="none" stroke="#A91C20" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18H6v32h32V18h-8"/><path d="M22 34V3"/><path d="M12 12 22 3l10 9"/></svg><svg width="54" height="54" viewBox="0 0 54 54" fill="none" stroke="#A91C20" stroke-width="4"><circle cx="27" cy="27" r="24"/><circle cx="16" cy="27" r="3" fill="#A91C20" stroke="none"/><circle cx="27" cy="27" r="3" fill="#A91C20" stroke="none"/><circle cx="38" cy="27" r="3" fill="#A91C20" stroke="none"/></svg></div></div><div class="txt"><div class="p" style="font-size:46px"><span class="i">Por isso festa não é besteira.</span> Na minha empresa tem festa junina, futebol toda terça e comemoração a cada aluno novo.</div><div class="p" style="font-size:46px"><span class="hl sel">É assim que se constrói orgulho.</span></div></div><div class="draw"><svg viewBox="0 0 900 470"><rect x="130" y="90" width="140" height="140" stroke="#F2F2F2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 167.0L188.8 208L256 108" stroke="#F2F2F2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/><text x="200" y="290" fill="#F2F2F2" font-family="Montserrat" font-weight="700" font-size="26" text-anchor="middle">FESTA</text><text x="200" y="325" fill="#F2F2F2" font-family="Montserrat" font-weight="700" font-size="26" text-anchor="middle">JUNINA</text><rect x="380" y="90" width="140" height="140" stroke="#F2F2F2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M400 167.0L438.8 208L506 108" stroke="#F2F2F2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/><text x="450" y="290" fill="#F2F2F2" font-family="Montserrat" font-weight="700" font-size="26" text-anchor="middle">FUTEBOL</text><text x="450" y="325" fill="#F2F2F2" font-family="Montserrat" font-weight="700" font-size="26" text-anchor="middle">DE TERÇA</text><rect x="630" y="90" width="140" height="140" stroke="#F2F2F2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 167.0L688.8 208L756 108" stroke="#F2F2F2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/><text x="700" y="290" fill="#F2F2F2" font-family="Montserrat" font-weight="700" font-size="26" text-anchor="middle">ALUNO</text><text x="700" y="325" fill="#F2F2F2" font-family="Montserrat" font-weight="700" font-size="26" text-anchor="middle">NOVO</text></svg></div></div><script>
document.fonts.ready.then(()=>{document.querySelectorAll('.sel').forEach(el=>{
 const rs=[...el.getClientRects()];if(!rs.length)return;const a=rs[0],z=rs[rs.length-1],s=document.querySelector('.slide');
 const mk=(x,y1,y2,top)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:${x-2}px;top:${y1}px;width:4px;height:${y2-y1}px;background:#A91C20;z-index:5`;s.appendChild(d);
  const c=document.createElement('div');c.style.cssText=`position:absolute;left:${x-9}px;top:${top?y1-16:y2-2}px;width:18px;height:18px;border-radius:50%;background:#A91C20;z-index:5`;s.appendChild(c);};
 mk(a.left,a.top,a.bottom,true);mk(z.right,z.top,z.bottom,false);});});
</script></body></html>
