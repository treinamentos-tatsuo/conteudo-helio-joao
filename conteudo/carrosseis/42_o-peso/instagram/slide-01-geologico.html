<!DOCTYPE html>
<html lang="pt-BR">
<!-- Post 42 — "O peso procura quem aguenta." (skill /frase)
     Frase curta em 1 linha -> 44px, bloco único, tudo negrito, vermelho no punch.
     Imagem: composição de profundidade (câmera rente ao solo) -> SEM scale.
     Mask PADRÃO (26%): o topo da imagem gerada já é névoa pura, nenhum elemento escuro
     invade a faixa da frase — o fade estendido do post 39 apagaria a arquitrave. -->
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 36px; text-align:center; z-index:2; }
  .line{ white-space:nowrap; font-size:44px; line-height:1.3; font-weight:700; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
</style>
</head>
<body>
  <div class="slide">
    <img src="../imagens/img-14-geologico.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:0;width:100%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);z-index:1;">
    <div class="top" style="top:300px">
      <div class="line">O peso procura <span class="red">quem aguenta.</span></div>
    </div>
  </div>
</body>
</html>
