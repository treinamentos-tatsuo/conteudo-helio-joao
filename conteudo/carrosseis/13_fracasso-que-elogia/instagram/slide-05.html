<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .slide-photo{ position:absolute; bottom:0; left:0; width:100%; display:block; mix-blend-mode:multiply;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 24%);
    mask-image:linear-gradient(to bottom,transparent 0%,#000 24%); }
  .text{ position:absolute; left:0; right:0; padding:0 72px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:52px; }
  .line{ font-size:43px; line-height:1.36; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  .scr{ position:relative; display:inline-block; }
  .scr .u{ position:absolute; left:-3%; width:106%; height:0.5em; bottom:-0.22em; pointer-events:none; }
</style>
</head>
<body>
  <div class="slide">
    <img class="slide-photo" src="../imagens/img-05.png" alt="">
    <div class="text" style="top:210px">
      <div class="stanza">
        <div class="line">E cansado, você começa a pensar:</div>
        <div class="line" style="font-size:41px"><span class="scr">&ldquo;Deve ter um jeito mais fácil.&rdquo;<img class="u" src="../../_banco-referencias/elementos/sublinhado-rabisco.png" alt=""></span></div>
      </div>
      <div class="stanza">
        <div class="line">Não que exista de verdade.</div>
        <div class="line red">É só o cansaço falando.</div>
      </div>
    </div>
  </div>
</body>
</html>
