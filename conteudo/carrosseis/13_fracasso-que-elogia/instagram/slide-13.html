<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .slide-photo{ position:absolute; bottom:300px; left:0; width:100%; display:block; mix-blend-mode:multiply;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 72%,transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 72%,transparent 100%); }
  .text{ position:absolute; left:0; right:0; padding:0 72px; text-align:center; z-index:2; }
  .line{ font-size:43px; line-height:1.36; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  .bottom{ position:absolute; left:0; right:0; padding:0 72px; text-align:center; z-index:2; }
  .cta-big{ font-size:72px; font-weight:700; line-height:1.18; color:#1A1A1A; }
  .cta-big .red{ color:#A91C20; font-weight:700; }
  .cta-sm{ font-size:35px; font-weight:400; line-height:1.36; color:#1A1A1A; margin-top:18px; }
</style>
</head>
<body>
  <div class="slide">
    <img class="slide-photo" src="../imagens/img-13.png" alt="">
    <div class="text" style="top:210px">
      <div class="line">Disciplina repetida vira cultura.</div>
      <div class="line red">E cultura constrói empresa.</div>
    </div>
    <div class="bottom" style="bottom:120px">
      <div class="cta-big">Comenta <span class="red">CULTURA</span>,</div>
      <div class="cta-sm">que eu te mostro como transformar o básico<br>em rotina que a sua empresa não larga.</div>
    </div>
  </div>
</body>
</html>
