<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .slide-photo{ position:absolute; bottom:0; left:0; width:100%; display:block; mix-blend-mode:multiply;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 24%);
    mask-image:linear-gradient(to bottom,transparent 0%,#000 24%); }
  .text{ position:absolute; left:0; right:0; padding:0 72px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:52px; }
  .line{ font-size:43px; line-height:1.36; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
</style>
</head>
<body>
  <div class="slide">
    <img class="slide-photo" src="../imagens/img-02.png" alt="">
    <div class="text" style="top:205px">
      <div class="stanza">
        <div class="line">Acompanhar o número, cobrar a meta,</div>
        <div class="line">puxar a venda através do time.</div>
      </div>
      <div class="stanza">
        <div class="line">Você já sabe o que faz crescer.</div>
        <div class="line red">O problema é continuar fazendo.</div>
      </div>
    </div>
  </div>
</body>
</html>
