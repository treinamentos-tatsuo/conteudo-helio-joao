<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 80px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:46px; }
  .line{ font-size:44px; line-height:1.3; font-weight:400; color:#1A1A1A; }
  .bred{ color:#A91C20; font-weight:700; }
  .red{ color:#A91C20; font-weight:700; }
  .ital{ font-style:italic; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.1; letter-spacing:0.5px; color:#A91C20; }
  .photo{ position:absolute; bottom:0; left:0; width:100%; mix-blend-mode:multiply; }
  .scr{ position:relative; display:inline-block; }
  .scr .u{ position:absolute; left:-3%; width:106%; height:0.5em; bottom:-0.20em; pointer-events:none; }
  .cta-big{ font-size:72px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .cta-big .red{ color:#A91C20; font-weight:700; }
  .cta-sm{ font-size:36px; font-weight:400; line-height:1.35; color:#1A1A1A; margin-top:14px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="top" style="top:240px">
      <div class="stanza">
        <div class="line">Deixa subir no salto.</div>
        <div class="line">Gente boa precisa disso.</div>
      </div>
      <div class="stanza">
        <div class="line">Se não for aqui dentro,</div>
        <div class="line bred">vai ser na empresa do lado.</div>
      </div>
    </div>
    <img class="photo" src="../imagens/img-04.png" alt="" style="-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 15%);mask-image:linear-gradient(to bottom,transparent 0%,#000 15%);">
  </div>
</body>
</html>
