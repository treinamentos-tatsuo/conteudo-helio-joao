<!doctype html><html><head><meta charset="utf-8">
<!-- J321 opção 3: foto única (mbv-ultimo-recebido-2026-11-03_05, cor), frase no escuro acima do Hélio, Montserrat 600/700. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1350px;background:#000;overflow:hidden;position:relative;color:#fff;font-family:Montserrat,sans-serif}
img{position:absolute;inset:0;width:1080px;height:1350px}.g{position:absolute;inset:0}
.blk{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.ln{white-space:nowrap;line-height:1;display:inline-block}.sm{font-weight:600;letter-spacing:.5px;font-size:36px}.bg{font-weight:700;letter-spacing:-.5px}</style></head><body>
<img src="../../imagens/unica.jpg">
<div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.85) 0%,rgba(0,0,0,.6) 20%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 75%,rgba(0,0,0,.6) 100%)"></div>
<div class="blk" style="top:120px">
  <div class="ln sm">A sorte nunca me encontrou</div>
  <div class="ln bg" data-w="460" style="margin-top:8px">parado.</div>
</div>
<script>
document.fonts.ready.then(()=>{document.querySelectorAll('[data-w]').forEach(e=>{
 const W=+e.dataset.w;let fs=40;e.style.fontSize=fs+'px';
 for(let i=0;i<30;i++){fs=fs*W/e.getBoundingClientRect().width;e.style.fontSize=fs+'px';}
});});
</script></body></html>
