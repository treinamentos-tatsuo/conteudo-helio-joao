<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 90px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:34px; }
  .line{ font-size:44px; line-height:1.32; font-weight:600; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase; line-height:1.12; letter-spacing:0.5px; color:#A91C20; }
  .cta-big{ font-size:64px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .oq{ margin-left:-0.42em; }
  .cq{ margin-right:-0.43em; }
</style>
</head>
<body>
<style>.line:not(.anton){font-size:42px}</style>
  <div class="slide">
    <img src="../imagens/img-07.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:0;width:100%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,0.06) 8.5%,rgba(0,0,0,0.30) 18.7%,rgba(0,0,0,0.72) 27.2%,#000 34.0%);mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,0.06) 8.5%,rgba(0,0,0,0.30) 18.7%,rgba(0,0,0,0.72) 27.2%,#000 34.0%);z-index:1;">
    <div class="top" style="top:200px">
      <div class="stanza">
        <div class="line">O time te nomeia olhando, não ouvindo.</div>
      </div>
      <div class="stanza">
        <div class="line">A hora que você chega.</div>
        <div class="line">A sua postura sob pressão.</div>
        <div class="line red">De quem é a culpa quando dá errado.</div>
      </div>
    </div>
  </div>
</body>
</html>
