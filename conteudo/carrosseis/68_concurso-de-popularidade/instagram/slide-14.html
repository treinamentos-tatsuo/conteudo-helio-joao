<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 70px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:52px; }
  .line{ font-size:44px; line-height:1.26; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  b{ font-weight:700; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.12; letter-spacing:0.5px; color:#A91C20; }
  .cta-big{ font-size:64px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .cta-sm{ font-size:35px; font-weight:400; line-height:1.34; color:#1A1A1A; margin-top:20px; }
  .cta-last{ font-size:32px; font-weight:400; line-height:1.34; color:#1A1A1A; margin-top:34px; font-style:italic; }
</style>
</head>
<body>
  <div class="slide">
    <img src="../imagens/img-14.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:0;width:100%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);z-index:1;">
    <div class="top" style="top:210px">
      <div class="line" style="font-size:40px">Se você prefere ser respeitado a ser querido,</div>
      <div class="cta-big" style="margin-top:26px">comenta <span class="red">RESPEITO</span></div>
      <div class="cta-sm">que eu te chamo no direct e te mostro, no meu treinamento<br>de gestão pra pequena e média empresa, como construir<br>o rumo que faz o seu time te levar a sério.</div>
      <div class="cta-last">O resto continua comprando lealdade com favor.</div>
    </div>
  </div>
</body>
</html>
