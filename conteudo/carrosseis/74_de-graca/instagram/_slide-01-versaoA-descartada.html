<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 36px; text-align:center; z-index:2; }
  .line{ white-space:nowrap; font-size:38px; line-height:1.3; font-weight:700; color:#1A1A1A; }
  /* faixa de convite: sem bloco de cor, so regra fina + caixa alta em carmim */
  .convite{ position:absolute; left:0; right:0; text-align:center; z-index:2; }
  .rule{ width:300px; height:2px; background:#A91C20; margin:0 auto; opacity:.85; }
  .conv{ font-size:27px; font-weight:700; letter-spacing:3.4px; color:#A91C20;
         text-transform:uppercase; padding:17px 0; }
</style>
</head>
<body>
  <div class="slide">
    <img src="../imagens/img-01.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:0;width:100%;transform-origin:bottom center;transform:scale(1.3);mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);mask-image:linear-gradient(to bottom,transparent 0%,#000 26%);z-index:1;">
    <div class="top" style="top:286px">
      <div class="line">Tem dono que trabalha o mês inteiro</div>
      <div class="line">pra descobrir no dia 31 que foi de graça.</div>
    </div>
    <div class="convite" style="top:520px">
      <div class="rule"></div>
      <div class="conv">Hoje, 19h &middot; Aula ao vivo e gratuita</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
