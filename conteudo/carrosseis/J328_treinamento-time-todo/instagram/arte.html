<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0A0A0A;font-family:Montserrat,sans-serif;color:#fff;overflow:hidden}
.page{position:relative;width:1080px;height:1350px;padding:84px 84px 0}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:58px}
.eyebrow{font-weight:600;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#9A9A9A}
.eyebrow.red{color:#A91C20}
.tag{margin-top:120px}
h1{margin-top:22px;font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
h1 .r{color:#A91C20}
.com{margin-top:34px;font-weight:500;font-size:40px;color:#C7C7C7}
.com b{font-weight:800;color:#fff}
.data{margin-top:64px;display:flex;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14)}
.data div{flex:1;padding:30px 0}
.data div+div{border-left:1px solid rgba(255,255,255,.14);padding-left:40px}
.data .v{font-weight:900;font-size:72px;letter-spacing:-.02em;line-height:1;margin-top:12px}
.obj{margin-top:56px;display:flex;gap:28px}
.obj .bar{width:6px;background:#A91C20;flex:none}
.obj p{font-weight:500;font-size:34px;line-height:1.38;color:#E6E6E6;margin-top:14px}
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:space-between;padding:0 84px}
.foot img{opacity:.92}
.foot .alta{height:56px}.foot .acqua{height:58px}.foot .tatsuo{height:64px}
</style></head><body><div class="page">
  <div class="top">
    <span class="eyebrow">Treinamento · Time todo</span>
  </div>
  <div class="eyebrow red tag">Tema</div>
  <h1>Fazendo<br>a <span class="r">diferença</span></h1>
  <div class="com">com <b>Messias</b></div>
  <div class="data">
    <div><span class="eyebrow">Data</span><div class="v">06 NOV</div></div>
    <div><span class="eyebrow">Horário</span><div class="v">15H</div></div>
  </div>
  <div class="obj"><div class="bar"></div><div>
    <span class="eyebrow">Objetivo</span>
    <p>Descobrir caminhos para contribuir com o meu sucesso profissional e fazer a diferença na empresa que represento.</p>
  </div></div>
  <div class="foot">
    <img class="alta" src="logo-alta-branco.png">
    <img class="acqua" src="logo-acqua-branco.png">
    <img class="tatsuo" src="logo-tatsuo-on-dark.png">
  </div>
</div></body></html>
