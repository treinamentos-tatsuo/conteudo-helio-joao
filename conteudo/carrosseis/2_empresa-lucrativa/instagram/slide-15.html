<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .figura{ position:absolute; left:50%; transform:translateX(-50%); mix-blend-mode:multiply; z-index:1; }
  .top{ position:absolute; left:0; right:0; padding:0 70px; text-align:center; z-index:2; }
  .bottom{ position:absolute; left:0; right:0; padding:0 70px; text-align:center; z-index:2; }
  .mid{ position:absolute; left:0; right:0; padding:0 90px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:46px; }
  .line{ font-size:44px; line-height:1.26; font-weight:400; color:#1A1A1A; }
  .red{ color:#A91C20; font-weight:700; }
  b{ font-weight:700; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.12; letter-spacing:0.5px; color:#A91C20; }
  .anton.preto{ color:#1A1A1A; }
  .scr{ position:relative; display:inline-block; }
  .scr .u{ position:absolute; left:-3%; width:106%; height:0.5em; bottom:-0.26em; pointer-events:none; }
  .impact{ font-size:50px; font-weight:700; line-height:1.22; color:#1A1A1A; }
  .impact .red{ color:#A91C20; }
  .cta-big{ font-size:74px; font-weight:700; line-height:1.2; color:#1A1A1A; }
  .cta-sm{ font-size:34px; font-weight:400; line-height:1.32; color:#1A1A1A; margin-top:16px; }
</style>
</head>
<body>

  <div class="slide">
    <img class="figura" src="../imagens/img-15.png" alt="" style="top:435px;height:470px">
    <div class="top" style="top:225px">
      <div class="stanza">
        <div class="line" style="font-size:42px">Não queira a maior empresa da sua cidade.</div>
        <div class="line" style="font-size:42px"><span class="scr">Queira a que mais sobra pra você.<img class="u" src="../../_banco-referencias/elementos/sublinhado-rabisco.png" alt=""></span></div>
      </div>
    </div>
    <div class="bottom" style="bottom:165px">
      <div class="cta-big">Comenta <span class="red">LUCRO</span>,</div>
      <div class="cta-sm">que eu te mostro como transformar<br>faturamento em dinheiro no seu bolso.</div>
    </div>
  </div>

<script>
  function fit(){
    document.querySelectorAll('.anton[data-fit]').forEach(function(el){
      var ref = el.previousElementSibling ? el.previousElementSibling.getBoundingClientRect().width : 860;
      var target = ref; var size = 40; el.style.fontSize = size+'px';
      for (var i=0;i<80 && el.getBoundingClientRect().width < target; i++){ size+=2; el.style.fontSize=size+'px'; }
      if (size<52) size=52; if (size>118) size=118; el.style.fontSize=size+'px';
    });
  }
  if (document.fonts && document.fonts.ready){ document.fonts.ready.then(fit); } else { window.addEventListener('load', fit); }
  window.addEventListener('load', function(){ setTimeout(fit, 300); });
</script>
</body>
</html>
