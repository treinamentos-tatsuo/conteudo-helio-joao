<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif;color:#fff}
.p{position:absolute;left:0;width:1080px;height:450px;overflow:hidden}
.p img{position:absolute}
.g{position:absolute;inset:0}
.c{position:absolute;left:60px;right:60px;bottom:34px;text-align:center;font-weight:700;font-size:38px;line-height:1.3;letter-spacing:-.2px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
</style></head><body>

<div class="p" style="top:0">
  <img src="../imagens/foto-d.jpg" style="width:1080px;left:0;top:-400px">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 40%,rgba(0,0,0,.7) 72%,rgba(0,0,0,.95) 100%)"></div>
  <div class="c">Quem lidera não cansa de repetir.</div>
</div>

<div class="p" style="top:450px">
  <img src="../imagens/foto-a.jpg" style="width:1250px;left:-60px;top:-55px">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 70%,rgba(0,0,0,.96) 100%)"></div>
  <div class="c">Há dois mil anos, a igreja ensina<br>as mesmas lições todo domingo.</div>
</div>

<div class="p" style="top:900px">
  <img src="../imagens/foto-b.jpg" style="width:1450px;left:-140px;top:-120px">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 40%,rgba(0,0,0,.72) 70%,rgba(0,0,0,.97) 100%)"></div>
  <div class="c">Por isso o fiel sabe até o versículo de cor.<br>É assim que um time aprende a cultura.</div>
</div>
</body></html>
