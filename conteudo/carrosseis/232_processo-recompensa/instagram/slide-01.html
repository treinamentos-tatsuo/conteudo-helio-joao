<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1350px;background:#000;overflow:hidden;position:relative;color:#fff;font-family:Montserrat,sans-serif}
.p{position:absolute;left:0;width:1080px;height:675px;overflow:hidden}.p img{width:1080px;height:675px;display:block}
.g{position:absolute;inset:0}
.blk{position:absolute;display:flex;flex-direction:column;align-items:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.ln{white-space:nowrap;line-height:1;display:inline-block}
.sm{font-weight:600;letter-spacing:.5px}.bg{font-weight:700;letter-spacing:-.5px}.r{align-self:flex-end}</style></head><body>
<div class="p" style="top:0"><img src="../imagens/f1.jpg">
 <div class="g" style="background:linear-gradient(to left,rgba(0,0,0,.95) 0%,rgba(0,0,0,.8) 38%,rgba(0,0,0,0) 58%)"></div>
 <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 60%,rgba(0,0,0,.9) 100%)"></div>
 <div class="blk" style="left:600px;top:470px">
  <div class="ln sm" data-w="390">O processo que tira o seu</div>
  <div class="ln bg" data-w="390" style="margin-top:10px">sono hoje</div>
 </div></div>
<div class="p" style="top:675px"><img src="../imagens/f2.jpg" style="position:absolute;left:-190px;top:0">
 <div class="g" style="background:linear-gradient(to left,#000 0%,#000 18%,rgba(0,0,0,.75) 36%,rgba(0,0,0,0) 50%)"></div>
 <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.97) 0%,rgba(0,0,0,.6) 12%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.9) 100%)"></div>
 <div class="blk" style="left:600px;top:300px">
  <div class="ln sm" data-w="390">amanhã será a sua maior</div>
  <div class="ln bg" data-w="390" style="margin-top:10px">recompensa.</div>
 </div></div>
<script>
document.fonts.ready.then(()=>{document.querySelectorAll('[data-w]').forEach(e=>{
 const W=+e.dataset.w;let fs=40;e.style.fontSize=fs+'px';
 for(let i=0;i<30;i++){fs=fs*W/e.getBoundingClientRect().width;e.style.fontSize=fs+'px';}
});});
</script></body></html>
