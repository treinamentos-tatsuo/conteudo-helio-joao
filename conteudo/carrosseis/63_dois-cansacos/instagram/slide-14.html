<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#F5F0EB url("../../_banco-referencias/background para carrosséis.png") center/cover no-repeat;
    font-family:'Source Serif Pro',serif; }
  .top{ position:absolute; left:0; right:0; padding:0 90px; text-align:center; z-index:2; }
  .stanza + .stanza{ margin-top:34px; }
  .line{ font-size:41px; line-height:1.32; font-weight:600; color:#1A1A1A; }
  .line.red{ font-weight:700; color:#A91C20; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.1; letter-spacing:0.5px; }
  .cta-word{ color:#A91C20; font-weight:700; }
</style>
</head>
<body>
  <div class="slide">
    <img src="../imagens/img-14.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:132%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 20%);mask-image:linear-gradient(to bottom,transparent 0%,#000 20%);z-index:1;">
    <div class="top" style="top:215px">
      <div class="stanza">
        <div class="line">No meu treinamento voc&ecirc; monta essa r&eacute;gua</div>
        <div class="line">e para de ser o revisor da sua empresa.</div>
      </div>
      <div class="stanza" style="margin-top:56px">
        <div class="line" style="font-size:44px">Comenta <span class="cta-word">FOLGA</span> que eu te chamo no direct.</div>
      </div>
    </div>
  </div>
</body>
</html>
