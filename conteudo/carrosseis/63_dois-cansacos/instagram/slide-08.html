<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Anton&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  .slide{ width:1080px; height:1350px; position:relative; overflow:hidden;

  .line.red{ font-weight:700; color:#A91C20; }
  .anton{ font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    line-height:1.1; letter-spacing:0.5px; }

</style>
</head>
<body>
  <div class="slide">
    <img src="../imagens/img-08.png" alt="" onerror="this.style.display='none'" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:123%;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 20%);mask-image:linear-gradient(to bottom,transparent 0%,#000 20%);z-index:1;">
    <div class="top" style="top:205px">
      <div class="stanza">
        <div class="line">E volta tudo pra voc&ecirc; por um motivo s&oacute;:</div>
        <div class="line">ningu&eacute;m a&iacute; sabe onde est&aacute; a sua r&eacute;gua.</div>
      </div>
      <div class="stanza">
        <div class="line">Voc&ecirc; nunca botou ela na parede.</div>
        <div class="line red">COBROU DE CABE&Ccedil;A E ACEITOU O QUE VEIO.</div>
      </div>
    </div>
  </div>
</body>
</html>
