<!doctype html><html><head><meta charset="utf-8">
<!--
  "CAPA DE REVISTA" (foto única, palavra-soco atrás da cabeça). Origem: post 191 "Na feira, quem não grita /
  volta pra casa com a BANCA CHEIA." (06/10). Peça única, usar só quando a pessoa pedir esse estilo.
  Camadas, de trás pra frente: base.jpg (foto escurecida) > texto > sujeito.png (o Hélio recortado, por cima das letras).
  As duas imagens saem do scripts/capa_revista.py (máscara do scripts/lift.swift). Nunca o Hélio recortado em fundo preto chapado.
  A palavra grande (Anton) é ajustada pra 900 px de largura = 90 px de margem de cada lado.
  (O 191 saiu com 980 px, 50 px de margem, antes da regra de 90 px; a regra vale também aqui.)
  Ajustar o top das imagens até o cabelo só encostar na base das letras, sem cobrir nenhuma.
  Render: node .claude/skills/frase-foto/scripts/render.js <este arquivo>
-->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden;position:relative;color:#fff}
.L{position:absolute;left:0;width:1080px}
.g{position:absolute;inset:0}
.big{position:absolute;left:0;right:0;text-align:center;font-family:'Anton',sans-serif;font-size:208px;line-height:1;letter-spacing:2px;white-space:nowrap}
.sm{position:absolute;left:0;right:0;text-align:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:40px;letter-spacing:.5px;line-height:1.25}
</style></head><body>
  <img class="L" src="../imagens/base.jpg" style="top:245px">
  <div class="g" style="background:linear-gradient(to bottom,#000 0%,#000 19%,rgba(0,0,0,.55) 25%,rgba(0,0,0,0) 34%)"></div>
  <div class="sm" style="top:150px">Na feira, quem não grita<br>volta pra casa com a</div>
  <div class="big" id="big" style="top:275px">BANCA CHEIA.</div>
  <img class="L" src="../imagens/sujeito.png" style="top:245px">
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 80%,rgba(0,0,0,.85) 100%)"></div>
<script>
document.fonts.ready.then(()=>{const b=document.getElementById('big');let fs=200;b.style.fontSize=fs+'px';
const s=document.createElement('span');s.textContent=b.textContent;s.style.font=getComputedStyle(b).font;s.style.letterSpacing='2px';s.style.position='absolute';s.style.visibility='hidden';document.body.appendChild(s);
for(let i=0;i<20;i++){s.style.fontSize=fs+'px';fs=fs*900/s.getBoundingClientRect().width;}b.style.fontSize=fs+'px';});
</script>
</body></html>
