<!doctype html><html><head><meta charset="utf-8">
<!--
  2 FAIXAS COM O HÉLIO DE UM LADO E DEGRADÊ PRETO LATERAL. Origem: post 190 "Não há nada mais extraordinário /
  que fazer o básico bem feito todos os dias." (05/10, versão final v5e).
  Uso: quando o Hélio olha pro lado onde a foto acaba (ou onde tem plateia/sobra). NÃO espelhar a foto (o olhar
  inverte junto e o texto continua nas costas dele): posicionar a foto original com o Hélio do lado oposto ao olhar
  e completar o quadro com o degradê preto que vem do lado do texto. Aqui o Hélio fica à esquerda e o texto à direita;
  pro contrário, trocar "to right" por "to left" nos degradês laterais e mover os blocos.
  Trocar: fotos, width/left/top de cada <img>, textos, data-w (largura que cada linha ocupa; o script ajusta a fonte).
  Margem: o 190 saiu com 48 px na direita (antes da regra de 90 px). Aqui o bloco foi ajustado pra caber em 90.
  Render: node .claude/skills/frase-foto/scripts/render.js <este arquivo>
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden;font-family:'Montserrat',sans-serif;color:#fff}
.p{position:absolute;left:0;width:1080px;overflow:hidden}
.p img{position:absolute}
.g{position:absolute;inset:0}
.blk{position:absolute;left:470px;width:500px;display:flex;flex-direction:column;align-items:flex-start;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.ln{white-space:nowrap;line-height:1;display:inline-block}
.sm{font-weight:600;letter-spacing:.5px}
.bg{font-weight:700;letter-spacing:-.5px}
.r{align-self:flex-end}
</style></head><body>
<div class="p" style="top:0;height:610px">
  <img src="../imagens/foto-cima.jpg" style="width:1500px;left:-495px;top:-200px">
  <div class="g" style="background:linear-gradient(to right,rgba(0,0,0,0) 52%,rgba(0,0,0,.75) 78%,#000 93%)"></div>
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.9) 100%)"></div>
  <div class="blk" style="top:400px">
    <div class="ln sm" data-w="310">Não há nada mais</div>
    <div class="ln bg" data-w="500" style="margin-top:10px">extraordinário</div>
  </div>
</div>
<div class="p" style="top:610px;height:740px">
  <img src="../imagens/foto-baixo.jpg" style="width:1700px;left:-456px;top:-390px">
  <div class="g" style="background:linear-gradient(to right,rgba(0,0,0,0) 52%,rgba(0,0,0,.75) 78%,#000 93%)"></div>
  <div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 14%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.92) 100%)"></div>
  <div class="blk" style="top:445px">
    <div class="ln sm" data-w="500">que fazer o básico bem feito</div>
    <div class="ln bg" data-w="480" style="margin-top:12px;margin-left:20px">todos os dias.</div>
  </div>
</div>
<script>
document.fonts.ready.then(()=>{document.querySelectorAll('[data-w]').forEach(e=>{
 const W=+e.dataset.w;let fs=40;e.style.fontSize=fs+'px';
 for(let i=0;i<30;i++){fs=fs*W/e.getBoundingClientRect().width;e.style.fontSize=fs+'px';}
});});
</script>
</body></html>
