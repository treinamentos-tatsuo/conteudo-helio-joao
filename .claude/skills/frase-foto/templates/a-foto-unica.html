<!doctype html><html><head><meta charset="utf-8">
<!--
  FOTO ÚNICA. Origem: post 221 "Não há nada que você faça 10 mil vezes / que você não fique bom." (08/10).
  Foto: imagens/foto.jpg em 1080x1350 (scripts/prepara_foto.py --tam 1080x1350; no 221: P&B, --contraste 1.15).
  A foto desce (img top:330px) e abre preto em cima; a frase fica nesse preto, acima do Hélio, nunca no rodapé.
  Texto em caixa alta espaçada (Montserrat 600, 29 px, tracking 4 px): o user aprovou "dessa vez", achou mais
  difícil de ler. Pode trocar a fonte/tamanho; o que não muda é a posição e a margem.
  .t left/right 90 px = margem mínima. Se a linha não couber, diminuir a fonte ou quebrar a linha.
  Render: node .claude/skills/frase-foto/scripts/render.js <este arquivo>
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1350px;background:#000;overflow:hidden;position:relative;color:#fff;font-family:Montserrat,sans-serif}
img{position:absolute;left:0;top:330px;width:1080px;height:1350px}
.g{position:absolute;inset:0;background:linear-gradient(to bottom,#000 0%,#000 30%,rgba(0,0,0,.6) 38%,rgba(0,0,0,0) 50%)}
.t{position:absolute;left:90px;right:90px;top:300px;text-align:center;font-weight:600;font-size:29px;line-height:1.7;letter-spacing:4px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap}</style></head><body>
<img src="../imagens/foto.jpg"><div class="g"></div>
<div class="t">Não há nada que você faça 10 mil vezes<br>que você não fique bom.</div>
</body></html>
