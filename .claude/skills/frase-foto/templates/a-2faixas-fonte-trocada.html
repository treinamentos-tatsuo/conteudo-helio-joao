<!doctype html><html><head><meta charset="utf-8">
<!--
  FRASE MÉDIA EM 2 FAIXAS IGUAIS (675 + 675), PARTIDA NO PONTO DE SENTIDO. Origem: post 217
  "A visão do futuro é a lanterna que guia // a liderança no presente." (08/10).
  Fotos: imagens/foto-cima.jpg e foto-baixo.jpg já recortadas em 1080x675 (scripts/prepara_foto.py --tam 1080x675).
  No 217: P&B em cima e cor embaixo (escolha daquela peça, não regra).
  Texto: Inter na ligação + Times New Roman só na expressão-chave de cada bloco (o "A" fica na mesma linha de
  "visão do futuro", em Inter). Linhas pequenas coladas na palavra grande (margin negativa/encaixe).
  Bloco a 110 px do pé de cada faixa (.t bottom:110px), nunca no rodapé.
  Emenda: a faixa de baixo nasce .97 de preto e abre até 0 em 30%.
  Render: node .claude/skills/frase-foto/scripts/render.js <este arquivo>
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1350px;background:#000;overflow:hidden;position:relative;font-family:Montserrat,sans-serif;color:#fff}
.p{position:absolute;left:0;width:1080px;height:675px;overflow:hidden}.p img{width:1080px;height:675px;display:block}
.g{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 50%,rgba(0,0,0,.72) 78%,rgba(0,0,0,.95) 100%)}
.t{position:absolute;left:30px;right:30px;bottom:110px;text-align:center;font-weight:700;font-size:62px;line-height:1.12;letter-spacing:-.5px;text-shadow:0 1px 3px rgba(0,0,0,.5)}.l{font-family:Inter,sans-serif;font-weight:500;font-size:46px;letter-spacing:-.5px;line-height:1}
.h{font-family:'Times New Roman',serif;font-weight:700;font-size:150px;letter-spacing:-2px;line-height:.82}
.hi{font-style:italic}
.blk{display:inline-flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="p" style="top:0px"><img src="../imagens/foto-cima.jpg"><div class="g"></div>
  <div class="t"><div class="blk">
    <span class="h" style="font-size:118px;white-space:nowrap"><span class="l" style="font-size:60px;margin-right:14px">A</span>visão do futuro</span>
    <span class="l" style="align-self:flex-end;margin-top:6px">é a lanterna que guia</span>
  </div></div>
</div>
<div class="p" style="top:675px"><img src="../imagens/foto-baixo.jpg"><div class="g" style="background:linear-gradient(to bottom,rgba(0,0,0,.97) 0%,rgba(0,0,0,.6) 12%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 50%,rgba(0,0,0,.72) 78%,rgba(0,0,0,.95) 100%)"></div>
  <div class="t"><div class="blk">
    <span class="l" style="align-self:flex-start;margin-left:18px;margin-bottom:-22px;position:relative;z-index:1">a liderança no</span>
    <span class="h hi">presente.</span>
  </div></div>
</div>
</body></html>
